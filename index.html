<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sheep Celica Documentation</title>
  <meta
    name="description"
    content="Customer-facing guides and media for Sheep Celica projects."
  >
  <link rel="stylesheet" href="assets/styles/site.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1 class="home-title">Sheep Celica Projects</h1>
    </section>

    <section class="section" id="products">
      <div class="section-heading">
        <div>
          <h2>Products</h2>
        </div>
      </div>
      <div class="product-grid">
        <a class="card-link" href="products/pop-up-controller-v10/">
          <div>
            <h3>Pop-up Controller V10</h3>
            <figure class="product-card-preview">
              <img
                src="images/pop-up-controller-v10/preview.png"
                alt="Pop-up Controller V10 preview"
              >
            </figure>
          </div>
        </a>

        <a class="card-link card-link--development" href="products/oled-display-module/">
          <div>
            <h3>OLED Display Module</h3>
            <figure class="product-card-preview">
              <img
                src="images/oled-display-module/preview.png"
                alt="OLED Display Module preview"
              >
              <figcaption class="product-card-preview__status">In Development</figcaption>
            </figure>
          </div>
        </a>
      </div>
    </section>

    <section class="section" id="guides">
      <div class="section-heading">
        <div>
          <h2>Guides</h2>
        </div>
      </div>
      <div class="guide-grid guide-grid--product-size">
        <a class="card-link" href="guides/instrument-cluster/">
          <div>
            <h3>Instrument Cluster</h3>
            <figure class="product-card-preview">
              <img
                src="images/guides/instrument-cluster/main_image.png"
                alt="Toyota Celica instrument cluster preview"
                width="926"
                height="375"
              >
            </figure>
          </div>
        </a>
      </div>
    </section>

  </main>
  <script src="assets/scripts/site-config.js"></script>
  <script src="assets/scripts/site-shell.js"></script>
</body>
</html>
